# Run the example tests (examples/run_tests.py -c) on every push and pull
# request, with all nine assemblers, so that each disassembly is also checked
# to reassemble to the original binary.
#
# acme, xa, 64tass and cc65 (ca65) come from Ubuntu's packages. beebasm, Baron,
# Merlin 32, z88dk-z80asm and sjasmplus aren't packaged, so they're built from
# source at a fixed version, and cached, so they're only built again when the
# versions below change.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest Python versions the tests are run with
        python: ["3.9", "3.14"]
    env:
      BEEBASM_COMMIT: ca2cc5fd2fa3f73da3b0682ad004b2aca99840c3   # beebasm 1.11
      BARON_TAG: v0.6.0
      MERLIN32_TAG: v1.1.11                                      # (which reports itself as v1.1.10)
      Z88DK_TAG: v2.4
      SJASMPLUS_TAG: v1.24.0
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install acme, xa, 64tass, cc65, ninja and jsonschema
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q acme xa65 64tass cc65 ninja-build
          python -m pip install -q jsonschema

      - name: Cache beebasm, Baron, Merlin 32, z88dk-z80asm and sjasmplus
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/assemblers
          key: assemblers-${{ runner.os }}-beebasm-${{ env.BEEBASM_COMMIT }}-baron-${{ env.BARON_TAG }}-merlin32-${{ env.MERLIN32_TAG }}-z88dk-${{ env.Z88DK_TAG }}-sjasmplus-${{ env.SJASMPLUS_TAG }}

      - name: Build beebasm, Baron, Merlin 32, z88dk-z80asm and sjasmplus
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/assemblers
          git clone -q https://github.com/stardot/beebasm.git /tmp/beebasm
          git -C /tmp/beebasm checkout -q "$BEEBASM_COMMIT"
          make -C /tmp/beebasm/src code -j4
          cp /tmp/beebasm/beebasm ~/assemblers/
          # (Baron needs its richc submodule, and builds with CMake)
          git clone -q --depth 1 --branch "$BARON_TAG" --recurse-submodules --shallow-submodules https://github.com/waitingforvsync/baron.git /tmp/baron
          cmake -S /tmp/baron -B /tmp/baron/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/baron/build
          cp /tmp/baron/build/src/baron ~/assemblers/
          # (Merlin 32 builds with its GNUmakefile, which GNU make chooses)
          git clone -q --depth 1 --branch "$MERLIN32_TAG" https://github.com/lroathe/merlin32.git /tmp/merlin32
          make -C /tmp/merlin32/Source -j4
          cp /tmp/merlin32/Source/merlin32 ~/assemblers/
          git clone -q --depth 1 --branch "$Z88DK_TAG" https://github.com/z88dk/z88dk.git /tmp/z88dk
          cd /tmp/z88dk
          git submodule update -q --init --depth 1 ext/optparse ext/regex ext/uthash
          make src/config.h
          make -C src/z80asm z88dk-z80asm -j4
          cp src/z80asm/z88dk-z80asm ~/assemblers/
          # (USE_LUA=0: without its Lua scripting, which needs its submodules)
          git clone -q --depth 1 --branch "$SJASMPLUS_TAG" https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus
          make -C /tmp/sjasmplus USE_LUA=0 -j4
          cp /tmp/sjasmplus/sjasmplus ~/assemblers/

      - name: Add the assemblers to the PATH
        run: echo "$HOME/assemblers" >> "$GITHUB_PATH"

      - name: Run the tests
        working-directory: examples
        run: python run_tests.py -c
